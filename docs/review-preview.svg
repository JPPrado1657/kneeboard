="795">Session validation</text><text x="389" y="795">→</text><text x="548" y="795">→</text></g><rect x="780" y="460" width="615" height="380" rx="10" fill="#191d27" stroke="#303644"/><path d="M790 461H1385Q1394 461 1394 472V502H781V472Q781 461 790 461" fill="#232937"/><text x="799" y="487" fill="#d0d8e9" font-family="monospace" font-size="12">src/session.py · modified</text><g font-family="monospace" font-size="13"><rect x="781" y="518" width="613" height="29" fill="#26243b"/><text x="800" y="538" fill="#baa9ed">@@ -21,4 +21,6 @@</text><g fill="#d0d8e9"><text x="800" y="575"> def is_valid(session, now):</text><text x="800" y="604">     if session is None:</text><text x="800" y="633">         return False</text></g><rect x="781" y="648" width="613" height="29" fill="#3b232b"/><text x="800" y="668" fill="#f2b4c0">-    return True</text><rect x="781" y="677" width="613" height="29" fill="#18362c"/><text x="800" y="697" fill="#b1e2c7">+    return now &gt; session.expires_at</text></g><text x="800" y="800" fill="#8993a8" font-size="11">Illustrative review content · fixed reusable interface</text></g></svg>
